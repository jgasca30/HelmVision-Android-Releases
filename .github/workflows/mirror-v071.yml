name: Mirror HelmVision 0.7.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mirror-v071.yml"

permissions:
  contents: write

jobs:
  mirror:
    if: github.repository == 'ajgasca0430/HelmVision-Android-Releases'
    runs-on: ubuntu-latest

    steps:
      - name: Download exact legacy release assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o helmvision-0.7.1.apk \
            "https://github.com/ajgasca0430/Frigate-Android-Releases/releases/download/v0.7.1/helmvision-0.7.1.apk"
          curl -fL --retry 3 -o helmvision-0.7.1.apk.sha256 \
            "https://github.com/ajgasca0430/Frigate-Android-Releases/releases/download/v0.7.1/helmvision-0.7.1.apk.sha256"
          curl -fL --retry 3 -o helmvision-0.7.1-release-manifest.txt \
            "https://github.com/ajgasca0430/Frigate-Android-Releases/releases/download/v0.7.1/helmvision-0.7.1-release-manifest.txt"

      - name: Verify exact asset digests
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '0dcfe14aba3ced351438c070eb456bb21495de07c21354f9eabf99d750f62f6f' \
            'helmvision-0.7.1.apk' | sha256sum -c -
          printf '%s  %s\n' \
            '1488959c5ec2c5d780908ada806eaa83679a423499cffe23e8f5aeb49e1e4aa4' \
            'helmvision-0.7.1.apk.sha256' | sha256sum -c -
          printf '%s  %s\n' \
            'f8148ec75f23d0e3a96070a1e39d5f75ff1bfeef3e56e379db9d2ebf503fcfe0' \
            'helmvision-0.7.1-release-manifest.txt' | sha256sum -c -
          grep -Fq '0dcfe14aba3ced351438c070eb456bb21495de07c21354f9eabf99d750f62f6f  helmvision-0.7.1.apk' \
            helmvision-0.7.1.apk.sha256

      - name: Create mirrored release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::v0.7.1 already exists in the new release repository.'
            exit 1
          fi
          gh release create v0.7.1 \
            helmvision-0.7.1.apk \
            helmvision-0.7.1.apk.sha256 \
            helmvision-0.7.1-release-manifest.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title 'HelmVision 0.7.1' \
            --notes 'Signed HelmVision Android release 0.7.1 (versionCode 53). Package: app.helmvision.android. SHA-256: 0dcfe14aba3ced351438c070eb456bb21495de07c21354f9eabf99d750f62f6f. Source commit: 6bc873d8ae6338be4fb8debbae733f985e16d47b.'
